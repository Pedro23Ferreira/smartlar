<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>SmartLar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#ff7a00; --brand-ink:#ffffff; --brand-soft:#ff7a001f; --doc:#ff7a00; --night:#0b0d12;
  --bg:#f3f5f2; --card:#fff; --ink:#16211b; --muted:#647069; --line:#e1e6e0;
  --warn:#a35a00; --warn-soft:#fff2df; --danger:#a33a3a; --danger-soft:#fbe7e7; --ok:#1e6b45;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
#app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--brand) 35%,transparent),transparent 60%),var(--night);color:#fff;border-bottom:2px solid var(--brand);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header.top .logo{width:54px;height:44px;display:grid;place-items:center;flex:none;color:var(--brand);font-weight:800}
header.top .logo img{max-width:100%;max-height:100%}
header.top .t{flex:1;min-width:0}
header.top .t b{display:block;font-size:15px;line-height:1.2;font-weight:800;font-style:italic;letter-spacing:.01em}
header.top select{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:3px 6px;font-size:12.5px;max-width:100%}
header.top select option{color:#000}
main{max-width:760px;margin:0 auto;padding:14px 14px 30px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .i{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:700;background:var(--brand-soft)}
h1{font-size:21px;margin:4px 0 12px;font-weight:800}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:#fbfcfa;border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff}
textarea{resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.d{color:var(--danger);border-color:#efc9c9}
.btn.s{padding:7px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .tt{font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef1ee;color:var(--muted)}
.tag.ok{background:var(--brand-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--danger-soft);color:var(--danger)}
.alert{background:var(--warn-soft);border:1px solid #f0d2a8;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:10px;color:#6b3d00}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.lines .ln{display:grid;grid-template-columns:1fr 64px 100px 34px;gap:6px;margin-bottom:6px;align-items:center}
.lines .ln.p4{grid-template-columns:1.3fr 1fr 1fr 34px}
.lines .ln.it{grid-template-columns:1fr 110px 34px}
.lines .ln.mt{grid-template-columns:52px 1fr 64px 34px}
.mph{width:52px;height:46px;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:#fbfcfa;font-size:18px}
.mph img{width:100%;height:100%;object-fit:cover}
.sum{background:#f7f8f6;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.sum .r{display:flex;justify-content:space-between;padding:2px 0}
.sum .r.t{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
.x{border:0;background:#f3e3e3;color:var(--danger);border-radius:8px;height:38px;cursor:pointer;font-weight:700}
.total{font-size:18px;font-weight:800;text-align:right;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;background:var(--brand);color:var(--brand-ink);border:0;border-radius:99px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.search{margin-bottom:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs div{position:relative}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--danger);color:#fff;border-radius:99px;width:22px;height:22px;cursor:pointer;font-size:12px}
.sigbox{border:1px dashed var(--line);border-radius:10px;min-height:70px;display:grid;place-items:center;background:#fbfcfa;cursor:pointer}
.sigbox img{max-height:70px}
.timeline .it{border-left:3px solid var(--brand);padding:4px 0 10px 12px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#16211b;color:#fff;padding:10px 16px;border-radius:12px;z-index:100;font-size:14px;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:16px;width:min(600px,100%)}
canvas.sig{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;touch-action:none;background:#fff}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";float:right;color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 14px 14px}

/* ===== Documento (PDF via imprimir) — segue o modelo da SmartLar ===== */
#docwrap{display:none;position:fixed;inset:0;z-index:80;background:#e9ece8;overflow:auto}
#docwrap.on{display:block}
#docbar{position:sticky;top:0;background:#0b0d12;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
#docbar .sp{flex:1}
.page{background:#fff;width:210mm;max-width:100%;margin:14px auto;padding:8mm 14mm 14mm;box-shadow:0 4px 20px rgba(0,0,0,.12);color:#111;font:10.5pt/1.45 Poppins,Arial,Helvetica,sans-serif}
.page table.pg{width:100%;border-collapse:collapse}
.page table.pg>thead>tr>td,.page table.pg>tbody>tr>td{border:0;padding:0}
.page .dlogo{text-align:center;padding-bottom:4mm}
.page .dlogo img{height:30mm;max-width:70mm;object-fit:contain}
.page .dt{text-align:center;font-size:17pt;font-weight:800;margin:2mm 0 8mm;line-height:1.2}
.page .dt span{display:block;font-size:15pt}
.page h2{font-size:13pt;font-weight:800;margin:8mm 0 3mm;padding-left:6mm}
.page table.kv,.page table.tb{width:100%;border-collapse:collapse;margin:0 0 6mm}
.page table.kv td,.page table.tb td,.page table.tb th{border:1px solid #222;padding:1.2mm 2.5mm;font-size:10pt;vertical-align:middle}
.page table.kv th,.page table.tb th{background:var(--doc);color:#000;font-weight:700;text-align:center;border:1px solid #222;padding:1.5mm;font-size:10.5pt}
.page table.kv.dark th{background:#262626;color:#fff;font-size:10pt}
.page table.kv td.k{width:28%;font-weight:700;font-size:9.5pt}
.page table.tb td.id{width:11%;text-align:center}
.page table.tb td.ph{width:16%;text-align:center;padding:1mm}
.page table.tb td.ph img{width:22mm;height:20mm;object-fit:contain}
.page table.tb td.c{text-align:center}
.page table.tipo td{text-align:center;font-weight:700}
.page ol.cl{list-style:none;padding:0 0 0 12mm;margin:3mm 0}
.page ol.cl li{display:grid;grid-template-columns:11mm 1fr;margin-bottom:1.5mm;text-align:justify}
.page ol.cl li b.n{font-weight:800}
.page ol.cl li.hl{color:#d40000;font-weight:800}
.page ul.pay{list-style:none;padding:0 0 0 6mm;margin:2mm 0}
.page ul.pay li{margin:2.5mm 0}
.page ul.pay li.tot{font-size:15pt;font-weight:800}
.page ul.pay li.tot small{font-size:10pt;font-weight:400}
.page ul.pay li.sub{padding-left:6mm}
.page .chk{display:inline-block;margin:1mm 6mm 1mm 0;font-weight:600}
.page .place{font-weight:800;margin:10mm 0 14mm}
.page .assin{text-align:center}
.page .assin .co{font-weight:800}
.page .assin .nm{font-family:"Great Vibes",cursive;font-size:22pt;margin-top:2mm}
.page .assin img{max-height:22mm}
.page .assin .ln{border-top:1px solid #333;width:70mm;margin:1mm auto 0;padding-top:1mm;font-size:9pt}
.page .foot{margin-top:8mm;font-size:8pt;color:#555;border-top:1px solid #ccc;padding-top:2mm;text-align:center}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  #app,#docbar,nav.bottom,.fab,.toast{display:none!important}
  #docwrap{position:static;display:block;background:#fff;overflow:visible}
  .page{margin:0;box-shadow:none;width:210mm;min-height:auto;page-break-after:always;padding:8mm 14mm 10mm}
  .page table.pg>thead{display:table-header-group}
  .page table.tb tr,.page ol.cl li,.page ul.pay li{break-inside:avoid}
  .page h2{break-after:avoid}
  .page:last-child{page-break-after:auto}
  .page th,.page td,.page li{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo" id="hLogo">S</div>
    <div class="t">
      <b id="hName">SmartLar</b>
      <select id="perfilSel" aria-label="Perfil da empresa"></select>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="bottom" id="nav">
  <button data-go="home"><span class="i">🏠</span>Início</button>
  <button data-go="propostas"><span class="i">📝</span>Orçamentos</button>
  <button data-go="clientes"><span class="i">👥</span>Clientes</button>
  <button data-go="mais"><span class="i">⚙️</span>Mais</button>
</nav>
<div id="docwrap">
  <div id="docbar">
    <button class="btn s" id="docClose">← Voltar</button>
    <span class="sp small" id="docHint">Para salvar em PDF: Imprimir → “Salvar como PDF”.</span>
    <button class="btn s p" id="docPrint">🖨️ Imprimir / PDF</button>
  </div>
  <div id="doc"></div>
</div>

function extenso(n){
  n=Math.floor(Math.abs(n)); if(n===0) return "zero";
  const u=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const d=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const c=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999=x=>{ if(!x) return ""; if(x===100) return "cem"; const ce=Math.floor(x/100), r=x%100, p=[]; if(ce) p.push(c[ce]);
    if(r){ if(r<20) p.push(u[r]); else { const de=Math.floor(r/10), un=r%10; p.push(un? d[de]+" e "+u[un] : d[de]); } } return p.join(" e "); };
  const mi=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), rest=n%1000, parts=[];
  if(mi) parts.push(mi===1?"um milhão":ate999(mi)+" milhões");
  if(mil) parts.push(mil===1?"mil":ate999(mil)+" mil");
  if(rest) parts.push(ate999(rest));
  if(parts.length===1) return parts[0];
  const last=parts.pop(); const useE = rest ? (rest<100||rest%100===0) : true;
  return parts.join(" ")+(useE?" e ":" ")+last;
}
function reaisExtenso(v){
  v=Math.round((Number(v)||0)*100)/100; const r=Math.floor(v), c=Math.round((v-r)*100); const p=[];
  if(r) p.push(extenso(r)+(r===1?" real":(r%1000000===0?" de reais":" reais")));
  if(c) p.push(extenso(c)+(c===1?" centavo":" centavos"));
  return p.length? p.join(" e "):"zero real";
}
const diasExtenso = n=>`${n} (${extenso(n)}) ${Number(n)===1?"dia":"dias"}`;

  form.addEventListener("submit",e=>{ e.preventDefault(); if(persist()){ toast("Orçamento salvo."); go("propostaForm",p.id); } });
  form.addEventListener("click",e=>{
    const a=e.target.dataset.act; if(!a) return;
    if(a==="delP"){ confirmBox("Excluir este orçamento?",()=>{ db.propostas=db.propostas.filter(x=>x.id!==p.id); save(); go("propostas"); }); }
    if(a==="docP"){ if(persist()) showDoc(docProposta(db.propostas.find(x=>x.id===p.id))); }
    if(a==="waP"){ if(persist()){ const pp=db.propostas.find(x=>x.id===p.id), c=cliente(pp.clienteId); window.open(waLink(c?.telefone, msgProposta(pp)),"_blank"); } }
    if(a==="dupP"){ if(persist()){ const cp=structuredClone(db.propostas.find(x=>x.id===p.id)); Object.assign(cp,{id:uid(),num:"",data:today(),status:"aberta",clienteId:""}); cp.num=nextNum("P"); db.propostas.push(cp); save(); toast("Cópia criada. Escolha o cliente."); go("propostaForm",cp.id); } }
  });
}
function compressImg(file,max,q){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }; img.src=r.result; }; r.readAsDataURL(file); });
}
function persistProposta(p,form,itens,mats){
  const tipo=(form.querySelector("input[name=tipoImovel]:checked")||{}).value||"";
  const cid=resolveCliente(form,tipo); if(!cid) return false;
  mats=(mats||[]).filter(m=>String(m.desc).trim());
  mats.forEach(m=>{ const k=m.desc.trim().toLowerCase(); const old=db.materiaisLib[k]; if(m.foto || !old) db.materiaisLib[k]={desc:m.desc.trim(), foto:m.foto||old?.foto||null}; });
  Object.assign(p,{data:form.data.value||today(), status:form.status.value, titulo:form.titulo.value.trim(), clienteId:cid, tipoImovel:tipo,
    pragas:checked(form,"pragas"), area:form.area?form.area.value:"", itens:itens.filter(i=>String(i.desc).trim()||num(i.valor)).map(i=>({desc:i.desc,valor:i.valor===""?"":num(i.valor)})),
    materiais:mats, valorMateriais:form.valorMateriais?num(form.valorMateriais.value):0,
    obs:form.obs.value, descontoPix:num(form.descontoPix.value), valorAvista:form.valorAvista.value===""?"":num(form.valorAvista.value), validade:num(form.validade.value)});
  if(!p.num) p.num=nextNum("P");
  const c=cliente(cid); if(c && tipo && !c.tipoImovel) c.tipoImovel=tipo;
  const i=db.propostas.findIndex(x=>x.id===p.id); if(i<0) db.propostas.push(p); else db.propostas[i]=p;
  return save();
}
function msgProposta(p){
  const pf=perfil(p.perfil), c=cliente(p.clienteId), t=propTotal(p), av=avista(p);
  let m=`Olá, ${(c?.nome||"").split(" ")[0]}! Segue o orçamento ${p.num} da ${pf.nome}${p.titulo?` — ${p.titulo}`:""}:\n\n`;
  p.itens.forEach(i=>m+=`• ${i.desc}${num(i.valor)?`: ${money(i.valor)}`:""}\n`);
  if(p.materiais?.length) m+=`\nMateriais: ${p.materiais.length} itens${num(p.valorMateriais)?` (${money(p.valorMateriais)})`:""}\n`;
  m+=`\n*Valor total: ${money(t)}*`;
  if(av) m+=`\n${pf.rotuloAvista}: *${money(av)}*`;
  linesToList(pf.condicoes).forEach(l=>m+=`\n${l}`);
  if(p.validade) m+=`\n\nValidade: ${p.validade} dias.`;
  m+=`\n\nTe envio o PDF completo em seguida. Posso agendar?`;
  return m;
}

      ${linesToList(pf.condicoes).map(l=>`<li>❖ ${esc(l)}</li>`).join("")}</ul>`;
    if(p.validade) b+=`<h2>${++n}. VALIDADE DA PROPOSTA:</h2><ul class="pay"><li>➢ A proposta terá validade por ${diasExtenso(p.validade)};</li></ul>`;
    if(pf.garantiaTexto) b+=`<h2>${++n}. GARANTIA:</h2>`+clausulasHtml(linesToList(pf.garantiaTexto),n);
  } else {
    b+=`<div class="dt">${esc(pf.tituloProposta)}${p.titulo?`<span>${esc(p.titulo)}</span>`:""}</div>`;
    b+=tabCliente(c)+tabEmpresa(pf);
    b+=`<h2>${++n}. DETALHAMENTO DO SERVIÇO:</h2>
      <table class="tb"><thead><tr><th style="width:11%">ID.</th><th>DESCRIÇÃO DE SERVIÇO</th></tr></thead>
      ${p.itens.map((i,k)=>`<tr><td class="id">${k+1}</td><td>${esc(i.desc)}</td></tr>`).join("")||`<tr><td class="id">1</td><td></td></tr>`}</table>`;
    b+=clausulasHtml(linesToList(pf.clausulas),n);
    if(p.obs) b+=`<div style="padding-left:12mm">${nl(p.obs)}</div>`;
    if(p.materiais?.length){
      const fotos=p.materiais.some(m=>m.foto);
      b+=`<h2>${++n}. LISTA DE MATERIAIS:</h2><table class="tb"><thead><tr><th style="width:${fotos?16:11}%">ID.</th><th>DESCRIÇÃO DE MATERIAL</th><th style="width:12%">QTD.</th></tr></thead>
        ${p.materiais.map((m,k)=>`<tr><td class="${fotos?"ph":"id"}">${m.foto?`<img src="${m.foto}">`:k+1}</td><td class="c">${esc(m.desc)}</td><td class="c">${esc(m.qtd||1)}</td></tr>`).join("")}</table>`;
    }
    if(pf.garantiaTexto) b+=`<h2>${++n}. GARANTIA:</h2>`+clausulasHtml(linesToList(pf.garantiaTexto),n);
    b+=`<h2>${++n}. CONDIÇÕES DE PAGAMENTO:</h2><ul class="pay">
      ${mt&&st?`<li>Valor da mão de obra – ${money(st)};</li><li>Valor dos materiais – ${money(mt)};</li>`:""}
      <li class="tot">● Valor Total – ${money(t)} <small>(${reaisExtenso(t)})</small></li>
      ${av?`<li class="sub">❖ ${esc(pf.rotuloAvista)}. <b>(valor total com desconto ${money(av)})</b></li>`:""}
      ${linesToList(pf.condicoes).map(l=>`<li class="sub">❖ ${esc(l)}</li>`).join("")}</ul>`;
    if(p.validade) b+=`<h2>${++n}. VALIDADE:</h2><ul class="pay"><li>Este orçamento é válido por ${diasExtenso(p.validade)}.</li></ul>`;
  }
  b+=assinatura(pf,p);
  return docWrap(pf,b);
}
function showDoc(html){ $("#doc").innerHTML=html; $("#docwrap").classList.add("on"); $("#docwrap").scrollTop=0; }
$("#docClose").onclick=()=>$("#docwrap").classList.remove("on");
$("#docPrint").onclick=()=>{ try{ window.print(); }catch(_){ toast("Use o menu do navegador → Imprimir."); } };

/* ================== AÇÕES GERAIS ================== */
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o && !e.target.closest("a,button:not([data-open])")){ go(o.dataset.open,o.dataset.id||null); return; }
  const a=e.target.closest("[data-act]"); if(!a || a.closest("form")) return;
  const act=a.dataset.act;
  if(act==="np"){ e.preventDefault(); go("propostaForm"); }
  if(act==="npc"){ go("propostaForm",null,{clienteId:a.dataset.c}); }
  if(act==="nc"){ go("clienteForm"); }
  if(act==="cfg"){ e.preventDefault(); go("config"); }
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-cli]")) { const box=$("#novoCli"); if(box) box.style.display = e.target.value==="__novo"?"block":"none"; }
});
let searchT;
document.addEventListener("input",e=>{
  const s=e.target.dataset?.search; if(!s) return;
  clearTimeout(searchT); const v=e.target.value;
  searchT=setTimeout(()=>{ route.extra=v; render(); const i=$(`[data-search="${s}"]`); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } },250);
});

applyTheme(); render();
</script>
</body>
