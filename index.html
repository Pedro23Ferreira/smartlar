<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e6b45">
<title>SmartLar</title>
<style>
:root{
  --brand:#1e6b45; --brand-ink:#ffffff; --brand-soft:#e6f2ea;
  --bg:#f3f5f2; --card:#fff; --ink:#16211b; --muted:#647069; --line:#e1e6e0;
  --warn:#a35a00; --warn-soft:#fff2df; --danger:#a33a3a; --danger-soft:#fbe7e7; --ok:#1e6b45;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
#app{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--brand-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
header.top .logo{width:38px;height:38px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;color:var(--brand);font-weight:800}
header.top .logo img{max-width:100%;max-height:100%}
header.top .t{flex:1;min-width:0}
header.top .t b{display:block;font-size:16px;line-height:1.2}
header.top select{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:8px;padding:3px 6px;font-size:12.5px;max-width:100%}
header.top select option{color:#000}
main{max-width:760px;margin:0 auto;padding:14px 14px 30px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;background:none;border:0;padding:6px 2px;border-radius:10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.bottom button .i{font-size:20px;line-height:1}
nav.bottom button.on{color:var(--brand);font-weight:700;background:var(--brand-soft)}
h1{font-size:21px;margin:4px 0 12px}
h2{font-size:16px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;border:1px solid var(--line);background:#fbfcfa;border-radius:10px;padding:10px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:#fff}
textarea{resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.wa{background:#1fa855;border-color:#1fa855;color:#fff}
.btn.d{color:var(--danger);border-color:#efc9c9}
.btn.s{padding:7px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13.5px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted)}
.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .tt{font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#eef1ee;color:var(--muted)}
.tag.ok{background:var(--brand-soft);color:var(--ok)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.r{background:var(--danger-soft);color:var(--danger)}
.alert{background:var(--warn-soft);border:1px solid #f0d2a8;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:10px;color:#6b3d00}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.lines .ln{display:grid;grid-template-columns:1fr 64px 100px 34px;gap:6px;margin-bottom:6px;align-items:center}
.lines .ln.p4{grid-template-columns:1.3fr 1fr 1fr 34px}
.x{border:0;background:#f3e3e3;color:var(--danger);border-radius:8px;height:38px;cursor:pointer;font-weight:700}
.total{font-size:18px;font-weight:800;text-align:right;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25;background:var(--brand);color:var(--brand-ink);border:0;border-radius:99px;padding:14px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.search{margin-bottom:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.thumbs div{position:relative}
.thumbs img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;background:var(--danger);color:#fff;border-radius:99px;width:22px;height:22px;cursor:pointer;font-size:12px}
.sigbox{border:1px dashed var(--line);border-radius:10px;min-height:70px;display:grid;place-items:center;background:#fbfcfa;cursor:pointer}
.sigbox img{max-height:70px}
.timeline .it{border-left:3px solid var(--brand);padding:4px 0 10px 12px;margin-left:4px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#16211b;color:#fff;padding:10px 16px;border-radius:12px;z-index:100;font-size:14px;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(10,20,14,.55);z-index:60;display:grid;place-items:center;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:16px;width:min(600px,100%)}
canvas.sig{width:100%;height:200px;border:1px solid var(--line);border-radius:10px;touch-action:none;background:#fff}
details.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px}
details.sec>summary{padding:13px 14px;font-weight:700;cursor:pointer;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";float:right;color:var(--muted)}
details.sec[open]>summary::after{content:"▴"}
details.sec>.in{padding:0 14px 14px}

/* ===== Documento (PDF via imprimir) ===== */
#docwrap{display:none;position:fixed;inset:0;z-index:80;background:#e9ece8;overflow:auto}
#docwrap.on{display:block}
#docbar{position:sticky;top:0;background:#16211b;color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
#docbar .sp{flex:1}
.page{background:#fff;width:210mm;max-width:100%;min-height:297mm;margin:14px auto;padding:14mm 14mm 16mm;box-shadow:0 4px 20px rgba(0,0,0,.12);color:#111;font:11pt/1.4 Arial,Helvetica,sans-serif}
.page h1{font-size:15pt;text-align:center;margin:6px 0 10px;letter-spacing:.02em}
.page h3{font-size:11pt;margin:14px 0 6px;color:var(--brand);text-transform:uppercase;border-bottom:2px solid var(--brand);padding-bottom:2px}
.page table{width:100%;border-collapse:collapse;margin:4px 0}
.page td,.page th{border:1px solid #bbb;padding:5px 7px;vertical-align:top;font-size:10pt}
.page th{background:var(--brand);color:#fff;text-align:left}
.page td.k{background:#f2f5f2;font-weight:700;width:34%}
.page .dhead{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--brand);padding-bottom:8px}
.page .dhead img{max-height:70px;max-width:160px}
.page .dhead .nm{font-size:16pt;font-weight:800;color:var(--brand)}
.page .dhead .sub{font-size:9.5pt;color:#444}
.page .num{margin-left:auto;text-align:right;font-size:9.5pt}
.page ul{margin:4px 0;padding-left:18px}
.page .sigs{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}
.page .sigs div{text-align:center;font-size:9.5pt}
.page .sigs .sg{height:60px;display:flex;align-items:flex-end;justify-content:center}
.page .sigs img{max-height:60px;display:block;margin:0 auto}
.page .sigs .ln{border-top:1px solid #333;margin-top:4px;padding-top:3px}
.page .foot{margin-top:18px;font-size:8.5pt;color:#555;border-top:1px solid #ccc;padding-top:6px}
.page .big{font-size:13pt;font-weight:800}
.page .photos{display:flex;flex-wrap:wrap;gap:6px}
.page .photos img{width:31%;aspect-ratio:4/3;object-fit:cover;border:1px solid #ccc}
.page .chk{display:inline-block;margin:2px 10px 2px 0}
.page.poster{text-align:center}
.page.poster .warn{font-size:34pt;font-weight:900;color:#b00000;margin:20px 0 6px}
.page.poster .what{font-size:20pt;font-weight:800;margin-bottom:16px}
.page.poster table{text-align:left}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  #app,#docbar,nav.bottom,.fab,.toast{display:none!important}
  #docwrap{position:static;display:block;background:#fff;overflow:visible}
  .page{margin:0;box-shadow:none;width:210mm;min-height:auto;page-break-after:always}
  .page:last-child{page-break-after:auto}
  .page th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page td.k,.page .dhead,.page h3{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo" id="hLogo">S</div>
    <div class="t">
      <b id="hName">SmartLar</b>
      <select id="perfilSel" aria-label="Perfil da empresa"></select>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="bottom" id="nav">
  <button data-go="home"><span class="i">🏠</span>Início</button>
  <button data-go="propostas"><span class="i">📝</span>Orçamentos</button>
  <button data-go="clientes"><span class="i">👥</span>Clientes</button>
  <button data-go="mais"><span class="i">⚙️</span>Mais</button>
</nav>
<div id="docwrap">
  <div id="docbar">
    <button class="btn s" id="docClose">← Voltar</button>
    <span class="sp small" id="docHint">Para salvar em PDF: Imprimir → “Salvar como PDF”.</span>
    <button class="btn s p" id="docPrint">🖨️ Imprimir / PDF</button>
  </div>
  <div id="doc"></div>
</div>

<script>
"use strict";
/* =========================================================
   SmartLar — app de orçamentos  ·  v0.1.0
   Tudo roda neste arquivo; os dados ficam no aparelho
   (localStorage). Faça backup em Mais → Backup.
   ========================================================= */

const APP_VERSION = "0.1.0";
const KEY = "smartlar_app_v1";
const TIPOS = [["apto","Apartamento"],["casa","Casa"],["condominio","Condomínio"],["comercio","Comércio"],["outro","Outro"]];
const FORMAS = ["PIX","Dinheiro","Débito","Crédito","Link de pagamento","Transferência"];

function defaults(){
  return {
    v:1,
    ui:{perfil:"dedet"},
    empresa:{
      razao:"", fantasia:"SmartLar", cnpj:"66.204.341/0001-97",
      telefone:"(61) 99607-3257", email:"", endereco:"", cidade:"Brasília – DF",
      responsavelComercial:"Marjorie Eliza Leite de Siqueira Vieira",
      tecnico:"Alessandro Marques",
      rt:{nome:"", profissao:"", conselho:"", registro:""},
      licSanitaria:{numero:"", validade:""},
      licAmbiental:{numero:"", validade:""},
      ciatox:"0800 644 6774 (CIATox-DF, 24 h)"
    },
    perfis:[
      {id:"dedet", nome:"SmartLar Dedetização e Desratização", curto:"Dedetização", cor:"#1e6b45", logo:null,
       tituloProposta:"PROPOSTA TÉCNICA DE DEDETIZAÇÃO E DESRATIZAÇÃO",
       descontoPix:10, parcelamento:"", validadeDias:15,
       catalogo:[{nome:"Dedetização",preco:550},{nome:"Desratização",preco:600},{nome:"Descupinização",preco:0},{nome:"Desformigação",preco:0},{nome:"Desaranhação",preco:0}],
       obsExecucao:"Dedetização: aplicação de produtos para escorpião, barata, aranha e formiga nas dependências internas e externas, incluindo caixas de esgoto e tubulações similares.\nDesratização: aplicação de iscas nas áreas externas e internas das edificações.",
       clausulas:"A presente proposta contempla os serviços previamente acordados; qualquer serviço fora deste escopo será alvo de nova proposta.\nO horário de execução deverá ser informado previamente, caso haja restrição de horário no local.\nOs produtos utilizados são de marcas reconhecidas no mercado e registrados nos órgãos competentes.",
       garantiaTexto:""},
      {id:"serv", nome:"SmartLar Serviços & Segurança", curto:"Serviços", cor:"#173f73", logo:null,
       tituloProposta:"ORÇAMENTO TÉCNICO",
       descontoPix:5, parcelamento:"Em até 3x sem juros. Por link de pagamento, incluem-se as taxas da máquina.", validadeDias:15,
       catalogo:[{nome:"Conserto de portão",preco:0},{nome:"Instalação de motor de portão",preco:0},{nome:"Instalação de fechadura eletrônica",preco:0},{nome:"Instalação de televisão",preco:0},{nome:"Serviço de elétrica",preco:0},{nome:"Serviço de hidráulica",preco:0},{nome:"Desentupimento de pia e ralo",preco:0},{nome:"Limpeza de caixa d'água",preco:0},{nome:"Limpeza de calha",preco:0}],
       obsExecucao:"",
       clausulas:"O presente orçamento contempla os serviços previamente acordados; qualquer material ou serviço fora deste será alvo de nova proposta.\nO horário de execução deverá ser informado previamente, caso haja restrição de horário no local.\nOs materiais utilizados são de marcas reconhecidas no mercado, garantindo qualidade e durabilidade.\nO valor deste orçamento inclui a mão de obra e o material.",
       garantiaTexto:"90 dias em relação à instalação. A garantia não cobre prejuízos causados por mau uso."}
    ],
    pragas:["Escorpião","Barata germânica","Barata americana","Formiga","Aranha","Cupim","Rato","Traça","Pulga","Mosquito"],
    garantiaPadrao:{"Escorpião":90,"Barata germânica":90,"Barata americana":90,"Formiga":90,"Aranha":90,"Cupim":180,"Rato":90,"Traça":90,"Pulga":90,"Mosquito":30},
    periodicidade:{apto:180,casa:180,condominio:90,comercio:60,outro:180},
    ambientes:["Cozinha","Banheiros","Quartos","Sala","Área de serviço","Quintal / área externa","Garagem / estacionamento","Caixas de esgoto e gordura","Ralos e grelhas","Lixeiras","Área comum","Escadas","Corredores","Forro / telhado","Jardim"],
    metodos:["Pulverização (bomba de borrifação)","Gel inseticida","Iscas raticidas","Pó inseticida","Atomização / nebulização"],
    aplicadores:["Alessandro Marques"],
    orientacoes:"Evitar a entrada no ambiente tratado por 6 horas.\nManter animais de estimação e plantas afastados das áreas tratadas por 6 horas.\nRealizar a limpeza do ambiente somente após 6 horas, sem lavar rodapés e cantos tratados.\nEm caso de contato acidental, lavar com água corrente e procurar o CIATox.",
    produtos:[
      {id:"p1", nome:"(cadastre o nome comercial)", principio:"Alfa-cipermetrina e Flufenoxuron", grupo:"Piretróide e Benzoiluréia",
       concentracao:"", registro:"", acaoToxica:"Distúrbios sensoriais e cutâneos de hipersensibilidade, neurite periférica.",
       antidoto:"Não há antídoto específico. Tratamento sintomático e de suporte.", risco:"", pragas:"Escorpião, baratas, formigas, aranhas"}
    ],
    clientes:[], propostas:[], servicos:[], feitos:{}, seq:{P:0,S:0}
  };
}

/* ---------- armazenamento ---------- */
let db;
function deepMerge(base, d){
  if(Array.isArray(base) || typeof base!=="object" || base===null) return d===undefined?base:d;
  const o = Object.assign({}, base);
  for(const k in d){ o[k] = (k in base) ? deepMerge(base[k], d[k]) : d[k]; }
  return o;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ const d=JSON.parse(r); const m=deepMerge(defaults(), d);
    ["garantiaPadrao","feitos"].forEach(k=>{ if(d[k]) m[k]=d[k]; }); return m; } }catch(e){}
  return defaults();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch(e){ toast("Memória do aparelho cheia. Faça um backup e remova fotos antigas."); return false; }
}
db = load();

/* ---------- utilidades ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl = s=>esc(s).replace(/\n/g,"<br>");
const money = v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = v=>{ if(typeof v==="number") return v; const s=String(v||"").trim(); if(!s) return 0; return Number(s.includes(",")? s.replace(/\./g,"").replace(",","."): s)||0; };
const today = ()=>{ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso,n)=>{ if(!iso) return ""; const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+Number(n||0)); return d.toISOString().slice(0,10); };
const diffDays = (iso)=>Math.round((new Date(iso+"T12:00:00")-new Date(today()+"T12:00:00"))/864e5);
const fmtD = iso=>{ if(!iso) return ""; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; };
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const dataLonga = iso=>{ const [y,m,d]=(iso||today()).split("-"); return `${Number(d)} de ${MESES[Number(m)-1]} de ${y}`; };
const onlyDigits = s=>String(s||"").replace(/\D/g,"");
const perfil = id=>db.perfis.find(p=>p.id===(id||db.ui.perfil))||db.perfis[0];
const cliente = id=>db.clientes.find(c=>c.id===id);
const produto = id=>db.produtos.find(p=>p.id===id);
const tipoNome = t=>(TIPOS.find(x=>x[0]===t)||["","—"])[1];

function extenso(n){
  n=Math.floor(Math.abs(n)); if(n===0) return "zero";
  const u=["","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze","treze","catorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
  const d=["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
  const c=["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
  const ate999=x=>{ if(!x) return ""; if(x===100) return "cem"; const ce=Math.floor(x/100), r=x%100, p=[]; if(ce) p.push(c[ce]);
    if(r){ if(r<20) p.push(u[r]); else { const de=Math.floor(r/10), un=r%10; p.push(un? d[de]+" e "+u[un] : d[de]); } } return p.join(" e "); };
  const mi=Math.floor(n/1e6), mil=Math.floor((n%1e6)/1000), rest=n%1000, parts=[];
  if(mi) parts.push(mi===1?"um milhão":ate999(mi)+" milhões");
  if(mil) parts.push(mil===1?"mil":ate999(mil)+" mil");
  if(rest) parts.push(ate999(rest));
  if(parts.length===1) return parts[0];
  const last=parts.pop(); const useE = rest ? (rest<100||rest%100===0) : true;
  return parts.join(" ")+(useE?" e ":" ")+last;
}
function reaisExtenso(v){
  v=Math.round((Number(v)||0)*100)/100; const r=Math.floor(v), c=Math.round((v-r)*100); const p=[];
  if(r) p.push(extenso(r)+(r===1?" real":(r%1000000===0?" de reais":" reais")));
  if(c) p.push(extenso(c)+(c===1?" centavo":" centavos"));
  return p.length? p.join(" e "):"zero real";
}
const diasExtenso = n=>`${n} (${extenso(n)}) ${Number(n)===1?"dia":"dias"}`;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function waLink(tel, text){
  let d=onlyDigits(tel); if(d && d.length<=11) d="55"+d;
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}
function nextNum(k){ db.seq[k]=(db.seq[k]||0)+1; return `${k}-${new Date().getFullYear()}-${String(db.seq[k]).padStart(3,"0")}`; }
function linesToList(s){ return String(s||"").split("\n").map(x=>x.trim()).filter(Boolean); }

/* ---------- tema / cabeçalho ---------- */
function applyTheme(){
  const p=perfil(); const r=document.documentElement.style;
  r.setProperty("--brand",p.cor); r.setProperty("--brand-soft",p.cor+"1f");
  $('meta[name=theme-color]').setAttribute("content",p.cor);
  $("#hName").textContent=p.nome;
  $("#hLogo").innerHTML = p.logo? `<img src="${p.logo}" alt="">` : "S";
  $("#perfilSel").innerHTML = db.perfis.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>Perfil: ${esc(x.curto)}</option>`).join("");
}
$("#perfilSel").addEventListener("change",e=>{ db.ui.perfil=e.target.value; save(); applyTheme(); render(); });

/* ---------- roteamento ---------- */
let route={v:"home",id:null,extra:null};
function go(v,id=null,extra=null){ route={v,id,extra}; render(); window.scrollTo(0,0); }
function render(){
  $$("#nav button").forEach(b=>b.classList.toggle("on", b.dataset.go===({propostaForm:"propostas",clienteForm:"clientes",ficha:"clientes",config:"mais"}[route.v]||route.v)));
  const views={home,propostas,propostaForm,clientes,clienteForm,ficha,mais,config};
  (views[route.v]||home)();
}
$("#nav").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go); });

/* ================== INÍCIO ================== */
function home(){
  const mes=today().slice(0,7);
  const minhas=db.propostas.filter(p=>p.perfil===db.ui.perfil);
  const abertas=minhas.filter(p=>p.status==="aberta");
  const aprovMes=minhas.filter(p=>p.status==="aprovada" && (p.data||"").startsWith(mes));
  const doMes=minhas.filter(p=>(p.data||"").startsWith(mes));
  const vencendo=abertas.filter(p=>{ const d=diffDays(addDays(p.data,p.validade)); return d>=0 && d<=3; });
  $("#main").innerHTML = `
    <h1>Olá! 👋</h1>
    <div class="stats">
      <div class="stat"><small>Orçamentos no mês</small><b>${doMes.length}</b></div>
      <div class="stat"><small>Aprovados no mês</small><b>${aprovMes.length}</b><small>${money(aprovMes.reduce((a,p)=>a+propTotal(p),0))}</small></div>
      <div class="stat"><small>Em aberto</small><b>${abertas.length}</b><small>${money(abertas.reduce((a,p)=>a+propTotal(p),0))}</small></div>
      <div class="stat"><small>Taxa de aprovação</small><b>${(()=>{ const dec=minhas.filter(p=>p.status!=="aberta"); return dec.length? Math.round(100*dec.filter(p=>p.status!=="recusada").length/dec.length)+"%":"—"; })()}</b></div>
    </div>
    <h2>⏳ Orçamentos vencendo (até 3 dias)</h2>
    <div class="card">${vencendo.length? vencendo.map(p=>{ const c=cliente(p.clienteId);
      return `<div class="item" style="cursor:default"><div class="sp"><div class="tt">${esc(c?.nome||"")}</div>
        <div class="small muted">${p.num} · ${money(propTotal(p))} · vence ${fmtD(addDays(p.data,p.validade))}</div></div>
        ${c?.telefone?`<a class="btn s wa" target="_blank" rel="noopener" href="${waLink(c.telefone,`Olá, ${(c.nome||"").split(" ")[0]}! Passando para lembrar que o orçamento ${p.num} da ${perfil(p.perfil).nome} vale até ${fmtD(addDays(p.data,p.validade))}. Posso agendar?`)}">Lembrar</a>`:""}
        <button class="btn s" data-open="propostaForm" data-id="${p.id}">Abrir</button></div>`; }).join("") : `<div class="empty">Nenhum orçamento vencendo.</div>`}</div>
    <button class="btn p block" data-act="np" style="margin-top:6px">📝 Novo orçamento</button>`;
}

/* ================== PROPOSTAS ================== */
function propTotal(p){ return (p.itens||[]).reduce((a,i)=>a+num(i.qtd||1)*num(i.valor),0); }
function propostas(){
  const q=(route.extra||"").toLowerCase();
  const list=db.propostas.filter(p=>p.perfil===db.ui.perfil).filter(p=>!q || (cliente(p.clienteId)?.nome||"").toLowerCase().includes(q) || p.num.toLowerCase().includes(q))
    .sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  const st={aberta:["Aberta","w"],aprovada:["Aprovada","ok"],recusada:["Recusada","r"],concluida:["Concluída","ok"]};
  $("#main").innerHTML = `<h1>Orçamentos · ${esc(perfil().curto)}</h1>
    <input class="search" type="text" placeholder="Buscar cliente ou número…" value="${esc(route.extra||"")}" data-search="propostas">
    <div class="card">${list.length? list.map(p=>`<div class="item" data-open="propostaForm" data-id="${p.id}">
      <div class="sp"><div class="tt">${esc(cliente(p.clienteId)?.nome||"Sem cliente")}</div>
      <div class="small muted">${p.num} · ${fmtD(p.data)} · ${money(propTotal(p))}</div></div>
      <span class="tag ${st[p.status]?.[1]||""}">${st[p.status]?.[0]||p.status}</span></div>`).join("") : `<div class="empty">Nenhum orçamento ainda.</div>`}</div>
    <button class="fab" data-act="np">+ Orçamento</button>`;
}

function clienteSelect(sel){
  const opts=db.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.nome)}${c.bairro?" · "+esc(c.bairro):""}</option>`).join("");
  return `<label class="f">Cliente</label>
    <select name="clienteId" data-cli><option value="">Selecione…</option><option value="__novo">+ Novo cliente</option>${opts}</select>
    <div id="novoCli" style="display:none" class="card" >
      <div class="grid2"><div><label class="f">Nome / empresa</label><input type="text" name="nc_nome"></div>
      <div><label class="f">WhatsApp</label><input type="tel" name="nc_tel"></div></div>
      <div class="grid2"><div><label class="f">Endereço</label><input type="text" name="nc_end"></div>
      <div><label class="f">Bairro / cidade</label><input type="text" name="nc_bairro"></div></div>
      <label class="f">CPF / CNPJ</label><input type="text" name="nc_doc">
    </div>`;
}
function resolveCliente(form, tipo){
  let id=form.clienteId.value;
  if(id==="__novo"){
    const nome=form.nc_nome.value.trim(); if(!nome){ toast("Informe o nome do novo cliente."); return null; }
    const c={id:uid(), nome, telefone:form.nc_tel.value.trim(), endereco:form.nc_end.value.trim(), bairro:form.nc_bairro.value.trim(), doc:form.nc_doc.value.trim(), tipoImovel:tipo||"", responsavel:"", obs:""};
    db.clientes.push(c); id=c.id;
  }
  if(!id){ toast("Selecione o cliente."); return null; }
  return id;
}
function tipoRadios(sel){ return `<div class="chips">${TIPOS.map(([k,l])=>`<label class="chip"><input type="radio" name="tipoImovel" value="${k}" ${k===sel?"checked":""}><span>${l}</span></label>`).join("")}</div>`; }
function chipsChk(name, list, sel){ sel=sel||[]; return `<div class="chips">${list.map(v=>`<label class="chip"><input type="checkbox" name="${name}" value="${esc(v)}" ${sel.includes(v)?"checked":""}><span>${esc(v)}</span></label>`).join("")}</div>`; }
const checked = (form,name)=>$$(`input[name="${name}"]:checked`,form).map(i=>i.value);

function propostaForm(){
  const isNew=!route.id;
  const p = isNew ? {id:uid(), perfil:db.ui.perfil, num:"", data:today(), clienteId:route.extra?.clienteId||"", tipoImovel:cliente(route.extra?.clienteId)?.tipoImovel||"", pragas:[], area:"", itens:[], obs:perfil().obsExecucao, descontoPix:perfil().descontoPix, parcelamento:perfil().parcelamento, validade:perfil().validadeDias, status:"aberta"} : structuredClone(db.propostas.find(x=>x.id===route.id));
  if(!p){ go("propostas"); return; }
  const pf=perfil(p.perfil), dedet=pf.id==="dedet";
  $("#main").innerHTML = `<h1>${isNew?"Novo orçamento":"Orçamento "+esc(p.num)}</h1>
  <form id="pf" class="card" autocomplete="off">
    <div class="grid2"><div><label class="f">Data</label><input type="date" name="data" value="${p.data}"></div>
    <div><label class="f">Status</label><select name="status">${[["aberta","Aberta"],["aprovada","Aprovada"],["recusada","Recusada"]].map(([k,l])=>`<option value="${k}" ${p.status===k?"selected":""}>${l}</option>`).join("")}</select></div></div>
    ${clienteSelect(p.clienteId)}
    <label class="f">Tipo de imóvel</label>${tipoRadios(p.tipoImovel)}
    ${dedet?`<label class="f">Pragas-alvo</label>${chipsChk("pragas",db.pragas,p.pragas)}
    <label class="f">Área aproximada (m²) — opcional</label><input type="number" name="area" value="${esc(p.area)}" inputmode="decimal">`:""}
    <label class="f">${dedet?"Serviços":"Serviços e materiais"}</label>
    <div class="lines" id="lines"></div>
    <div class="row" style="margin-top:6px">
      <select id="addCat" style="flex:1"><option value="">+ Adicionar do catálogo…</option>${pf.catalogo.map((c,i)=>`<option value="${i}">${esc(c.nome)}${c.preco?" · "+money(c.preco):""}</option>`).join("")}</select>
      <button type="button" class="btn s" id="addFree">+ Item livre</button>
    </div>
    <div class="total" id="tot"></div>
    <label class="f">${dedet?"Observações de execução":"Detalhamento / observações"}</label><textarea name="obs" rows="4">${esc(p.obs)}</textarea>
    <div class="grid3">
      <div><label class="f">Desconto PIX (%)</label><input type="number" name="descontoPix" value="${esc(p.descontoPix)}"></div>
      <div><label class="f">Validade (dias)</label><input type="number" name="validade" value="${esc(p.validade)}"></div>
      <div><label class="f">Nº</label><input type="text" value="${esc(p.num||"(automático)")}" disabled></div>
    </div>
    <label class="f">Parcelamento / outras condições</label><input type="text" name="parcelamento" value="${esc(p.parcelamento)}">
    <div class="row" style="margin-top:14px">
      <button class="btn p" type="submit">💾 Salvar</button>
      ${isNew?"":`<button type="button" class="btn" data-act="docP">📄 Documento</button>
      <button type="button" class="btn wa" data-act="waP">WhatsApp</button>
      <span class="sp"></span><button type="button" class="btn d" data-act="delP">Excluir</button>`}
    </div>
  </form>`;
  const form=$("#pf"); let itens=p.itens.slice();
  const drawLines=()=>{
    $("#lines").innerHTML = itens.length? `<div class="ln small muted" style="margin-bottom:2px"><span>Descrição</span><span>Qtd</span><span>Valor un.</span><span></span></div>`+itens.map((it,i)=>`<div class="ln">
      <input type="text" data-i="${i}" data-k="desc" value="${esc(it.desc)}"><input type="number" data-i="${i}" data-k="qtd" value="${esc(it.qtd??1)}" inputmode="decimal">
      <input type="number" data-i="${i}" data-k="valor" value="${esc(it.valor)}" inputmode="decimal" step="0.01"><button type="button" class="x" data-rm="${i}">×</button></div>`).join("") : `<div class="small muted">Nenhum item. Adicione do catálogo ou um item livre.</div>`;
    upd();
  };
  const upd=()=>{ const t=propTotal({itens}); const dp=num(form.descontoPix.value); $("#tot").innerHTML=`Total: ${money(t)}${dp?` <span class="small muted">· no PIX: ${money(t*(1-dp/100))}</span>`:""}`; };
  drawLines();
  $("#lines").addEventListener("input",e=>{ const i=e.target.dataset.i; if(i===undefined) return; itens[i][e.target.dataset.k]=e.target.value; upd(); });
  $("#lines").addEventListener("click",e=>{ if(e.target.dataset.rm!==undefined){ itens.splice(+e.target.dataset.rm,1); drawLines(); }});
  $("#addCat").addEventListener("change",e=>{ const c=pf.catalogo[e.target.value]; if(c){ itens.push({desc:c.nome,qtd:1,valor:c.preco||""}); drawLines(); } e.target.value=""; });
  $("#addFree").addEventListener("click",()=>{ itens.push({desc:"",qtd:1,valor:""}); drawLines(); $$("#lines input[data-k=desc]").pop()?.focus(); });
  form.descontoPix.addEventListener("input",upd);
  form.addEventListener("submit",e=>{ e.preventDefault(); if(persistProposta(p,form,itens,isNew)){ toast("Orçamento salvo."); go("propostaForm",p.id); } });
  form.addEventListener("click",e=>{
    const a=e.target.dataset.act; if(!a) return;
    if(a==="delP"){ confirmBox("Excluir este orçamento?",()=>{ db.propostas=db.propostas.filter(x=>x.id!==p.id); save(); go("propostas"); }); }
    if(a==="docP"){ if(persistProposta(p,form,itens,false)) showDoc(docProposta(db.propostas.find(x=>x.id===p.id))); }
    if(a==="waP"){ if(persistProposta(p,form,itens,false)){ const pp=db.propostas.find(x=>x.id===p.id), c=cliente(pp.clienteId); window.open(waLink(c?.telefone, msgProposta(pp)),"_blank"); } }
  });
}
function persistProposta(p,form,itens,isNew){
  const tipo=(form.querySelector("input[name=tipoImovel]:checked")||{}).value||"";
  const cid=resolveCliente(form,tipo); if(!cid) return false;
  Object.assign(p,{data:form.data.value||today(), status:form.status.value, clienteId:cid, tipoImovel:tipo,
    pragas:checked(form,"pragas"), area:form.area?form.area.value:"", itens:itens.filter(i=>String(i.desc).trim()||num(i.valor)),
    obs:form.obs.value, descontoPix:num(form.descontoPix.value), validade:num(form.validade.value), parcelamento:form.parcelamento.value});
  if(!p.num) p.num=nextNum("P");
  const i=db.propostas.findIndex(x=>x.id===p.id); if(i<0) db.propostas.push(p); else db.propostas[i]=p;
  return save();
}
function msgProposta(p){
  const pf=perfil(p.perfil), c=cliente(p.clienteId), t=propTotal(p);
  let m=`Olá, ${(c?.nome||"").split(" ")[0]}! Segue a proposta ${p.num} da ${pf.nome}:\n\n`;
  p.itens.forEach(i=>m+=`• ${i.desc}${num(i.qtd)>1?` (${i.qtd}x)`:""}: ${money(num(i.qtd||1)*num(i.valor))}\n`);
  m+=`\n*Total: ${money(t)}*`;
  if(p.descontoPix) m+=`\nNo PIX (${p.descontoPix}% de desconto): ${money(t*(1-p.descontoPix/100))}`;
  if(p.parcelamento) m+=`\n${p.parcelamento}`;
  m+=`\n\nValidade: ${p.validade} dias. Posso agendar?`;
  return m;
}

function confirmBox(msg,ok){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><p style="margin-top:0">${esc(msg)}</p><div class="row"><span class="sp"></span><button class="btn" id="cbN">Cancelar</button><button class="btn d" id="cbY">Confirmar</button></div></div>`;
  document.body.appendChild(m); $("#cbN",m).onclick=()=>m.remove(); $("#cbY",m).onclick=()=>{ m.remove(); ok(); };
}

/* ================== CLIENTES ================== */
function clientes(){
  const q=(route.extra||"").toLowerCase();
  const list=db.clientes.filter(c=>!q || [c.nome,c.telefone,c.bairro,c.doc].join(" ").toLowerCase().includes(q)).sort((a,b)=>a.nome.localeCompare(b.nome));
  $("#main").innerHTML = `<h1>Clientes</h1>
    <input class="search" type="text" placeholder="Buscar por nome, telefone ou bairro…" value="${esc(route.extra||"")}" data-search="clientes">
    <div class="card">${list.length? list.map(c=>{ const n=db.propostas.filter(p=>p.clienteId===c.id).length;

/* ================== MAIS ================== */
function mais(){
  $("#main").innerHTML=`<h1>Mais</h1>
   <div class="card">
     <div class="item" data-open="config"><div class="sp"><div class="tt">⚙️ Empresa, perfis e padrões</div><div class="small muted">Logo, cores, preços, pragas e textos do orçamento</div></div>›</div>
   </div>
   <h2>Backup</h2>
   <div class="card">
     <p class="small muted" style="margin-top:0">Os dados ficam só neste aparelho. Faça backup com frequência e guarde o arquivo no Drive.</p>
     <div class="row"><button class="btn p" id="bkOut">⬇️ Baixar backup</button>
     <label class="btn">⬆️ Restaurar backup<input type="file" accept=".json,application/json" id="bkIn" hidden></label></div>
   </div>
   <p class="small muted" style="text-align:center">SmartLar · versão ${APP_VERSION}</p>`;
  $("#bkOut").onclick=()=>{ const b=new Blob([JSON.stringify(db)],{type:"application/json"}); const a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download=`smartlar-backup-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); };
  $("#bkIn").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.clientes) throw 0;
    confirmBox("Substituir todos os dados deste aparelho pelo backup?",()=>{ db=deepMerge(defaults(),d); save(); applyTheme(); toast("Backup restaurado."); go("home"); }); }catch(_){ toast("Arquivo de backup inválido."); } }; r.readAsText(f); };
}
function config(){
  const e=db.empresa;
  const catTxt=pf=>pf.catalogo.map(c=>`${c.nome} | ${c.preco||0}`).join("\n");
  const garTxt=Object.entries(db.garantiaPadrao).map(([k,v])=>`${k} | ${v}`).join("\n");
  const inp=(n,l,v,t="text")=>`<label class="f">${l}</label><input type="${t}" name="${n}" value="${esc(v)}">`;
  $("#main").innerHTML=`<h1>Configurações</h1>
  <form id="cfg" autocomplete="off">
  <details class="sec" open><summary>🏢 Empresa</summary><div class="in">
    ${inp("e_fantasia","Nome fantasia",e.fantasia)}${inp("e_razao","Razão social",e.razao)}
    <div class="grid2"><div>${inp("e_cnpj","CNPJ",e.cnpj)}</div><div>${inp("e_telefone","Telefone / WhatsApp",e.telefone)}</div></div>
    ${inp("e_email","E-mail",e.email,"email")}${inp("e_endereco","Endereço da empresa",e.endereco)}${inp("e_cidade","Cidade (para datar documentos)",e.cidade)}
    <div class="grid2"><div>${inp("e_resp","Responsável comercial",e.responsavelComercial)}</div><div>${inp("e_tec","Técnico responsável pela execução",e.tecnico)}</div></div>
  </div></details>
  ${db.perfis.map(pf=>`<details class="sec"><summary>🎨 Perfil: ${esc(pf.curto)}</summary><div class="in">
    ${inp(pf.id+"_nome","Nome no documento",pf.nome)}
    <div class="grid2"><div>${inp(pf.id+"_curto","Nome curto",pf.curto)}</div><div><label class="f">Cor</label><input type="color" name="${pf.id}_cor" value="${esc(pf.cor)}" style="width:100%;height:42px;border:1px solid var(--line);border-radius:10px"></div></div>
    <label class="f">Logo</label><div class="row"><div class="logo" style="width:60px;height:60px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden" id="lg_${pf.id}">${pf.logo?`<img src="${pf.logo}" style="max-width:100%;max-height:100%">`:"—"}</div>
      <label class="btn s">Escolher imagem<input type="file" accept="image/*" hidden data-logo="${pf.id}"></label>${pf.logo?`<button type="button" class="btn s d" data-rmlogo="${pf.id}">Remover</button>`:""}</div>
    ${inp(pf.id+"_titulo","Título da proposta",pf.tituloProposta)}
    <div class="grid2"><div>${inp(pf.id+"_pix","Desconto PIX padrão (%)",pf.descontoPix,"number")}</div><div>${inp(pf.id+"_val","Validade padrão (dias)",pf.validadeDias,"number")}</div></div>
    ${inp(pf.id+"_parc","Parcelamento padrão",pf.parcelamento)}
    <label class="f">Catálogo de serviços (um por linha: Nome | preço)</label><textarea name="${pf.id}_cat" rows="5">${esc(catTxt(pf))}</textarea>
    <label class="f">Texto padrão de execução / detalhamento</label><textarea name="${pf.id}_obs" rows="3">${esc(pf.obsExecucao)}</textarea>
    <label class="f">Cláusulas da proposta (uma por linha)</label><textarea name="${pf.id}_cl" rows="4">${esc(pf.clausulas)}</textarea>
    <label class="f">Texto de garantia</label><textarea name="${pf.id}_gt" rows="2">${esc(pf.garantiaTexto)}</textarea>
  </div></details>`).join("")}
  <details class="sec"><summary>🐜 Pragas</summary><div class="in">
    <label class="f">Pragas (uma por linha; o número depois de | é a garantia padrão em dias, usada nas próximas versões)</label><textarea name="gar" rows="8">${esc(garTxt)}</textarea>
  </div></details>
  <button class="btn p block">💾 Salvar configurações</button>
  </form>`;
  const f=$("#cfg"), V=n=>f.elements[n]?.value??"";
  $$("[data-logo]",f).forEach(i=>i.addEventListener("change",async ev=>{ const file=ev.target.files[0]; if(!file) return;
    const id=i.dataset.logo; perfil(id).logo=await logoData(file); save(); applyTheme(); $("#lg_"+id).innerHTML=`<img src="${perfil(id).logo}" style="max-width:100%;max-height:100%">`; toast("Logo atualizada."); }));
  $$("[data-rmlogo]",f).forEach(b=>b.addEventListener("click",()=>{ perfil(b.dataset.rmlogo).logo=null; save(); applyTheme(); config(); }));
  f.addEventListener("submit",ev=>{ ev.preventDefault();
    Object.assign(e,{fantasia:V("e_fantasia"),razao:V("e_razao"),cnpj:V("e_cnpj"),telefone:V("e_telefone"),email:V("e_email"),endereco:V("e_endereco"),cidade:V("e_cidade"),responsavelComercial:V("e_resp"),tecnico:V("e_tec")});
    db.perfis.forEach(pf=>{ Object.assign(pf,{nome:V(pf.id+"_nome"),curto:V(pf.id+"_curto")||pf.curto,cor:V(pf.id+"_cor"),tituloProposta:V(pf.id+"_titulo"),
      descontoPix:num(V(pf.id+"_pix")),validadeDias:num(V(pf.id+"_val")),parcelamento:V(pf.id+"_parc"),obsExecucao:V(pf.id+"_obs"),clausulas:V(pf.id+"_cl"),garantiaTexto:V(pf.id+"_gt"),
      catalogo:linesToList(V(pf.id+"_cat")).map(l=>{ const [n,p]=l.split("|"); return {nome:n.trim(),preco:num((p||"").trim())}; })}); });
    const g={}; linesToList(V("gar")).forEach(l=>{ const [n,d]=l.split("|"); if(n.trim()) g[n.trim()]=num((d||"90").trim())||90; });
    db.garantiaPadrao=g; db.pragas=Object.keys(g);
    save(); applyTheme(); toast("Configurações salvas."); go("mais"); });
}
function logoData(file){
  return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,500/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/png")); }; img.src=r.result; }; r.readAsDataURL(file); });
}

/* ================== DOCUMENTOS ================== */
function docHead(pf,titulo,numero,data){
  const e=db.empresa;
  return `<div class="dhead">${pf.logo?`<img src="${pf.logo}">`:""}
    <div><div class="nm">${esc(pf.nome)}</div><div class="sub">${e.cnpj?"CNPJ "+esc(e.cnpj)+" · ":""}${esc(e.telefone)}${e.email?" · "+esc(e.email):""}${e.endereco?"<br>"+esc(e.endereco):""}</div></div>
    <div class="num">${esc(numero)}<br>${fmtD(data)}</div></div><h1>${esc(titulo)}</h1>`;
}
function tabCliente(c, tipo){
  return `<table><tr><th colspan="2">CLIENTE</th></tr>
    <tr><td class="k">Nome / empresa</td><td>${esc(c?.nome)}</td></tr>
    ${c?.responsavel?`<tr><td class="k">Responsável</td><td>${esc(c.responsavel)}</td></tr>`:""}
    <tr><td class="k">Telefone / WhatsApp</td><td>${esc(c?.telefone)}</td></tr>
    ${c?.doc?`<tr><td class="k">CPF / CNPJ</td><td>${esc(c.doc)}</td></tr>`:""}
    <tr><td class="k">Endereço</td><td>${[c?.endereco,c?.bairro].filter(Boolean).map(esc).join(" – ")}</td></tr>
    ${tipo?`<tr><td class="k">Tipo de imóvel</td><td>${esc(tipoNome(tipo))}</td></tr>`:""}</table>`;
}
function docProposta(p){
  const pf=perfil(p.perfil), c=cliente(p.clienteId), e=db.empresa, t=propTotal(p), dedet=pf.id==="dedet";
  const comDesc=p.descontoPix? t*(1-p.descontoPix/100):0;
  return `<div class="page">${docHead(pf,pf.tituloProposta,"Proposta "+p.num,p.data)}
   ${tabCliente(c,p.tipoImovel)}
   <table><tr><th colspan="2">EMPRESA PRESTADORA DO SERVIÇO</th></tr>
    <tr><td class="k">Empresa</td><td>${esc(e.razao||pf.nome)}</td></tr>
    ${e.responsavelComercial?`<tr><td class="k">Responsável comercial</td><td>${esc(e.responsavelComercial)}</td></tr>`:""}
    ${e.tecnico?`<tr><td class="k">Técnico</td><td>${esc(e.tecnico)}</td></tr>`:""}
    <tr><td class="k">Telefone / WhatsApp</td><td>${esc(e.telefone)}</td></tr></table>
   ${dedet&&p.pragas.length?`<h3>1. Foco do serviço</h3><div>${p.pragas.map(x=>`<span class="chk">✓ ${esc(x)}</span>`).join("")}</div>${p.area?`<div>Área aproximada: ${esc(p.area)} m²</div>`:""}`:""}
   <h3>${dedet?"2":"1"}. ${dedet?"Serviços":"Detalhamento do serviço"}</h3>
   <table><tr><th style="width:8%">#</th><th>Descrição</th><th style="width:10%">Qtd</th><th style="width:18%">Valor un.</th><th style="width:18%">Valor</th></tr>
    ${p.itens.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.desc)}</td><td>${esc(i.qtd||1)}</td><td>${money(i.valor)}</td><td>${money(num(i.qtd||1)*num(i.valor))}</td></tr>`).join("")}
    <tr><td colspan="4" style="text-align:right"><b>VALOR TOTAL</b></td><td><b>${money(t)}</b></td></tr></table>
   ${p.obs?`<h3>${dedet?"3. Observações de execução":"Observações"}</h3><div>${nl(p.obs)}</div>`:""}
   ${pf.clausulas?`<ul>${linesToList(pf.clausulas).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
   ${pf.garantiaTexto?`<h3>Garantia</h3><div>${nl(pf.garantiaTexto)}</div>`:""}
   <h3>Condições de pagamento</h3>
   <div class="big">Valor total: ${money(t)} <span style="font-weight:400;font-size:10pt">(${reaisExtenso(t)})</span></div>
   ${p.descontoPix?`<div>Pagamento no PIX: <b>${p.descontoPix}% de desconto</b> → <b>${money(comDesc)}</b> (${reaisExtenso(comDesc)}).</div>`:""}
   ${p.parcelamento?`<div>${esc(p.parcelamento)}</div>`:""}
   <h3>Validade da proposta</h3><div>Esta proposta é válida por ${diasExtenso(p.validade)}, até ${fmtD(addDays(p.data,p.validade))}.</div>
   <p style="margin-top:20px">${esc(e.cidade)}, ${dataLonga(p.data)}.</p>
   <div class="sigs"><div><div class="sg"></div><div class="ln">${esc(pf.nome)}</div></div><div><div class="sg"></div><div class="ln">De acordo — ${esc(c?.responsavel||c?.nome||"Cliente")}</div></div></div>
   </div>`;
}
function showDoc(html){ $("#doc").innerHTML=html; $("#docwrap").classList.add("on"); $("#docwrap").scrollTop=0; }
$("#docClose").onclick=()=>$("#docwrap").classList.remove("on");
$("#docPrint").onclick=()=>{ try{ window.print(); }catch(_){ toast("Use o menu do navegador → Imprimir."); } };

/* ================== AÇÕES GERAIS ================== */
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"); if(o && !e.target.closest("a,button:not([data-open])")){ go(o.dataset.open,o.dataset.id||null); return; }
  const a=e.target.closest("[data-act]"); if(!a || a.closest("form")) return;
  const act=a.dataset.act;
  if(act==="np"){ e.preventDefault(); go("propostaForm"); }
  if(act==="npc"){ go("propostaForm",null,{clienteId:a.dataset.c}); }
  if(act==="nc"){ go("clienteForm"); }
  if(act==="cfg"){ e.preventDefault(); go("config"); }
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-cli]")) { const box=$("#novoCli"); if(box) box.style.display = e.target.value==="__novo"?"block":"none"; }
});
let searchT;
document.addEventListener("input",e=>{
  const s=e.target.dataset?.search; if(!s) return;
  clearTimeout(searchT); const v=e.target.value;
  searchT=setTimeout(()=>{ route.extra=v; render(); const i=$(`[data-search="${s}"]`); if(i){ i.focus(); i.setSelectionRange(v.length,v.length); } },250);
});

applyTheme(); render();
</script>
</body>
</html>
